# WhatsApp Ghost behind nginx
#
# Covers the three things that actually break in a reverse-proxied setup:
#
#   1. WebSockets (/_sandbox/clients/{wa_id}) need the Upgrade handshake and a
#      long read timeout, or the phone simulator reconnects every 60s.
#   2. Media uploads need client_max_body_size raised, or larger images 413.
#   3. WABA_BASE_URL must match this server_name, because Ghost puts that value
#      in the `url` field of GET /{media-id}. Leave it at the default and your
#      app receives an unreachable 127.0.0.1 URL. See the note at the bottom.
#
# Usage:
#   sudo cp whatsapp-ghost.conf /etc/nginx/sites-available/whatsapp-ghost
#   sudo ln -s /etc/nginx/sites-available/whatsapp-ghost /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# The container published on 127.0.0.1:8787 (see docker-compose.yml).
upstream whatsapp_ghost {
    server 127.0.0.1:8787;
    keepalive 32;
}

# Maps the client's Upgrade header to the value we forward upstream. Without
# this, a normal request would carry "Connection: upgrade" too, which breaks
# keepalive on everything that is not a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ghost.example.com;

    # Uploaded media is posted through this proxy. Meta's own limit is 100MB
    # for documents and 16MB for images/video; 32m is a sane middle ground.
    # Too low and POST /{phone_id}/media fails with 413 before reaching Ghost.
    client_max_body_size 32m;
    client_body_timeout 120s;

    # Ghost is a local sandbox and its payloads are small JSON or media blobs,
    # so proxy buffering adds latency without helping. Turning it off also
    # keeps webhook delivery timings honest when you are debugging them.
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ---- WebSocket: the phone simulator's live message feed ----------------
    #
    # phone.js opens ws(s)://<host>/_sandbox/clients/<wa_id> and reconnects
    # 1.5s after any close. The default proxy_read_timeout of 60s would drop
    # this idle-but-alive socket once a minute, so it is raised here rather
    # than relying on the client papering over it with reconnects.
    location /_sandbox/clients/ {
        proxy_pass http://whatsapp_ghost;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;

        # A quiet conversation sends nothing for minutes at a time; this is a
        # long-lived push channel, not a request/response call.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Never buffer or cache a stream.
        proxy_buffering off;
        proxy_cache off;
    }

    # ---- Media downloads ---------------------------------------------------
    #
    # Served to your backend, which passes a Bearer token. Do NOT add a cache
    # here that ignores the Authorization header: media is access-controlled
    # and a shared cache would hand one tenant's bytes to another.
    location /_sandbox/media/ {
        proxy_pass http://whatsapp_ghost;
        proxy_set_header Host $host;

        # Media can be tens of megabytes over a slow link.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ---- Everything else: Cloud API routes, console, static assets ---------
    location / {
        proxy_pass http://whatsapp_ghost;
        proxy_set_header Host $host;

        # Webhook delivery and template calls are fast, but a cold container
        # can take a moment on the first request.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }
}

# ---- TLS ------------------------------------------------------------------
#
# Recommended once a certificate exists (certbot --nginx -d ghost.example.com).
# Note the wss:// upgrade is identical: phone.js picks the scheme from
# location.protocol, so serving the page over HTTPS switches the socket to wss
# automatically with no config change beyond this block.
