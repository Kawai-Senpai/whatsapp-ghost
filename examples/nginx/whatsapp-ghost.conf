# ===========================================================================
# VARIANT A: bare IP and port, no domain name
# ===========================================================================
#
# For an internal box reached as http://10.0.0.42:8080 with no DNS name. The
# only real differences from the block above are server_name _ (match any Host)
# and the port. WABA_BASE_URL must still be set, to the same IP and port.
#
#     environment:
#       - WABA_BASE_URL=http://10.0.0.42:8080
#
# server {
#     listen 8080;
#     listen [::]:8080;
#     server_name _;                       # no hostname, match anything
#
#     client_max_body_size 32m;
#     proxy_buffering off;
#     proxy_http_version 1.1;
#     proxy_set_header Host              $host;
#     proxy_set_header X-Real-IP         $remote_addr;
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#
#     location /_sandbox/clients/ {
#         proxy_pass http://whatsapp_ghost;
#         proxy_set_header Upgrade    $http_upgrade;
#         proxy_set_header Connection $connection_upgrade;
#         proxy_read_timeout 3600s;
#         proxy_send_timeout 3600s;
#         proxy_buffering off;
#     }
#
#     location / {
#         proxy_pass http://whatsapp_ghost;
#     }
# }

# ===========================================================================
# VARIANT B: mounted under a subpath, e.g. https://example.com/wa/
# ===========================================================================
#
# READ THIS FIRST. Verified behaviour when Ghost is served under /wa/:
#
#     WORKS      the Cloud API      POST /wa/v25.0/{phone_id}/messages
#     WORKS      the sandbox API    GET  /wa/_sandbox/health
#     WORKS      WebSockets         101 on /wa/_sandbox/clients/{wa_id}
#     BROKEN     the browser console UI
#
# The console is the one casualty. Its HTML references root-absolute assets
# (/static/console.css, /static/console.js) and its JavaScript fetches
# root-absolute paths (/_sandbox/config, /v25.0/...). Under /wa/ the page
# itself loads, then every one of those requests goes to /static/... instead
# of /wa/static/... and 404s, leaving a blank console. No amount of
# proxy_pass rewriting fixes it, because the wrong paths are generated in the
# browser, after nginx is out of the picture.
#
# So use this variant when a backend integration is all you need. If humans
# must use the console, give Ghost its own hostname or port (the main block
# or Variant A) instead.
#
# WABA_BASE_URL must include the prefix:
#
#     environment:
#       - WABA_BASE_URL=https://example.com/wa
#
# server {
#     listen 80;
#     server_name example.com;
#
#     client_max_body_size 32m;
#     proxy_http_version 1.1;
#     proxy_set_header Host              $host;
#     proxy_set_header X-Real-IP         $remote_addr;
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#
#     # WebSockets first: a prefix location must be declared before the more
#     # general /wa/ block, or the general one swallows the upgrade request
#     # and the socket silently degrades to a plain proxied GET.
#     location /wa/_sandbox/clients/ {
#         rewrite ^/wa/(.*)$ /$1 break;    # strip the prefix before upstream
#         proxy_pass http://whatsapp_ghost;
#         proxy_set_header Upgrade    $http_upgrade;
#         proxy_set_header Connection $connection_upgrade;
#         proxy_read_timeout 3600s;
#         proxy_send_timeout 3600s;
#         proxy_buffering off;
#     }
#
#     location /wa/ {
#         rewrite ^/wa/(.*)$ /$1 break;
#         proxy_pass http://whatsapp_ghost;
#         proxy_read_timeout 120s;
#     }
# }

# ---- WABA_BASE_URL: the one setting people miss ---------------------------
#
# GET /{version}/{media-id} returns a JSON body containing a `url` your backend
# then fetches. Ghost builds that URL from WABA_BASE_URL, NOT from the incoming
# request, so proxying alone does not fix it.
#
# With this config, set it to the public origin before starting the container:
#
#     # docker-compose.yml
#     environment:
#       - WABA_BASE_URL=https://ghost.example.com     # https:// once TLS is on
#
# Verify end to end:
#
#     curl -s -H "Authorization: Bearer $TOKEN" \
#          https://ghost.example.com/v25.0/<media-id> | jq -r .url
#
# The printed URL must start with https://ghost.example.com. If it shows
# http://127.0.0.1:8787, WABA_BASE_URL is still at its default and any client
# on another host will fail to download media.
